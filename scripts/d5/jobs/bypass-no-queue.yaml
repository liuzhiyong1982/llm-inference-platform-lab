# Intentionally non-compliant: a GPU Job without the Kueue queue label.
# Before Kyverno is installed this Job runs and bypasses the quota.
# After Kyverno is installed the same manifest is rejected at admission.
apiVersion: batch/v1
kind: Job
metadata:
  name: bypass-no-queue
  namespace: team-a
  labels:
    team: team-a
spec:
  suspend: false
  backoffLimit: 0
  template:
    metadata:
      labels:
        team: team-a
    spec:
      restartPolicy: Never
      priorityClassName: gpu-low
      containers:
        - name: holder
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
