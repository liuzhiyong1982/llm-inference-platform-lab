# D4.5 colocated 控制组：4 个 vLLM 副本，每个 1×L4，4 张卡全用满。
#
# 目的：和 PD 2P+2D 用同样的 4 张卡、同样的模型/输入输出/SLO，比较
#       “4 个完整副本” vs “2 prefill + 2 decode”。
#
# 用法：
#   kubectl create namespace d45 --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -n d45 -f scripts/d4.5/colocated-4x.yaml
#
# 注意：PD 实验统一用 llm-d PD guide 的 vLLM v0.31.0；不要用 D4 的 v0.34.0，
# 否则两个 arm 的引擎版本不一致。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-colocated
  labels:
    app: vllm-colocated
    llm-d.ai/guide: pd-colocated
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vllm-colocated
  template:
    metadata:
      labels:
        app: vllm-colocated
        llm-d.ai/guide: pd-colocated
        llm-d.ai/model: qwen3-8b
    spec:
      runtimeClassName: nvidia
      terminationGracePeriodSeconds: 120
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.31.0
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - "/models/Qwen3-8B-AWQ"
            - "--served-model-name=qwen3-8b"
            - "--max-model-len=8192"
            - "--gpu-memory-utilization=0.90"
            - "--max-num-seqs=64"
            - "--max-num-batched-tokens=4096"
            - "--block-size=64"
            - "--enable-prefix-caching"
            - "--shutdown-timeout=45"
            - "--disable-log-requests"
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: "2"
              memory: 10Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
            - name: cache
              mountPath: /.cache
            - name: triton
              mountPath: /.triton
      volumes:
        - name: models
          hostPath:
            path: /models
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: cache
          emptyDir: {}
        - name: triton
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-colocated
  labels:
    app: vllm-colocated
spec:
  selector:
    app: vllm-colocated
  ports:
    - name: http
      port: 8000
      targetPort: http
