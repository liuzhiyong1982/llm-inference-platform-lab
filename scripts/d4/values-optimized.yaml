# D4 fallback：optimized baseline（近似 prefix cache + load-aware）。
#
# 当 precise routing 的 render/KV-events 跑不通时，用这条路径仍然能拿到
# “round-robin vs EPP”的 P99 对比和命中率，只是 EPP 的前缀估计是近似的，
# 不是 vLLM KV block 的精确索引。
#
# 安装：
#   helm upgrade --install d4-router \
#     oci://ghcr.io/llm-d/charts/llm-d-router-standalone \
#     -n d4 --version v1.0.0 \
#     -f guides/recipes/router/base.values.yaml \
#     -f <本文件>
router:
  inferencePool:
    failureMode: FailOpen
  modelServers:
    type: vllm
    protocol: http
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "d4-prefix-routing"

  proxy:
    enabled: true
    proxyType: envoy
    failOpen: true
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        memory: 2Gi

  epp:
    replicas: 1
    flags:
      v: 2
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        memory: 8Gi
    pluginsConfigFile: "optimized-plugins.yaml"
    pluginsCustomConfig:
      optimized-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
          - type: approx-prefix-cache-producer
          - type: inflight-load-producer
          - type: prefix-cache-affinity-filter
            parameters:
              # 同 precise：guide 默认值是 H100/Qwen3-32B 的，L4 要重测。
              peakPrefillThroughput: 15926
          - type: token-load-scorer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: prefix-cache-affinity-filter
              - pluginRef: token-load-scorer

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081
