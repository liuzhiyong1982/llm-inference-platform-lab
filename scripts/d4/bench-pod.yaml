# D4 压测客户端 Pod 模板。
#
# 用法（在仓库根目录）：
#   export URL="http://d4-router-epp/v1/completions"
#   export ARM="precise"       # direct | random | precise
#   export RUN="1"
#   export POD_URLS="http://10.42.0.10:8000,http://10.42.0.11:8000"
#   export FORCE_CLOSE="0"     # direct arm 设为 1
#   export SESSIONS="32" TURNS="4" PREFIX_WORDS="1100" SUFFIX_WORDS="80"
#   export MAX_TOKENS="128" CONCURRENCY="16" SEED="42" WARMUP="4"
#   kubectl delete pod d4-bench -n d4 --ignore-not-found
#   envsubst < scripts/d4/bench-pod.yaml | kubectl apply -n d4 -f -
#   kubectl wait --for=condition=Ready pod/d4-bench -n d4 --timeout=120s
#   kubectl logs -f d4-bench -n d4
#
# 结果写到宿主机 /results/<ARM>-run<RUN>.json（hostPath），VM 销毁前 scp 回本地。
apiVersion: v1
kind: Pod
metadata:
  name: d4-bench
  labels:
    app: d4-bench
spec:
  restartPolicy: Never
  containers:
    - name: bench
      image: vllm/vllm-openai:v0.34.0
      imagePullPolicy: IfNotPresent
      command: ["bash", "/scripts/run_bench.sh"]
      env:
        - name: URL
          value: "${URL}"
        - name: ARM
          value: "${ARM}"
        - name: RUN
          value: "${RUN}"
        - name: POD_URLS
          value: "${POD_URLS}"
        - name: FORCE_CLOSE
          value: "${FORCE_CLOSE}"
        - name: SESSIONS
          value: "${SESSIONS}"
        - name: TURNS
          value: "${TURNS}"
        - name: PREFIX_WORDS
          value: "${PREFIX_WORDS}"
        - name: SUFFIX_WORDS
          value: "${SUFFIX_WORDS}"
        - name: MAX_TOKENS
          value: "${MAX_TOKENS}"
        - name: CONCURRENCY
          value: "${CONCURRENCY}"
        - name: SEED
          value: "${SEED}"
        - name: WARMUP
          value: "${WARMUP}"
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi
      volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: results
          mountPath: /results
  volumes:
    - name: scripts
      configMap:
        name: d4-bench
    - name: results
      hostPath:
        path: /results
        type: DirectoryOrCreate
