# D4 Lab 1：llm-d 1.0 standalone router + precise prefix-cache routing。
#
# 安装（在 llm-d release-1.0 仓库根目录执行）：
#   helm install d4-router \
#     oci://ghcr.io/llm-d/charts/llm-d-router-standalone \
#     -n d4 --version v1.0.0 \
#     -f guides/recipes/router/base.values.yaml \
#     -f <本文件>
#
# 本文件假设：
#   - 模型服务器 Pod 带 llm-d.ai/guide=d4-prefix-routing
#   - 模型是 qwen3-4b（--served-model-name），vLLM 开了 --enable-scale-out
#   - 两个副本各 1×RTX 3060 12GB，block-size=64
router:
  inferencePool:
    failureMode: FailOpen   # EPP 不可用时 Envoy 继续按 headless Service 负载均衡
  modelServers:
    type: vllm
    protocol: http
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/guide: "d4-prefix-routing"

  proxy:
    enabled: true
    proxyType: envoy
    # standalone chart 的 values.yaml 默认已经是 true；这里显式写，
    # 避免以后换 chart/values 时静默变成 fail-close。
    failOpen: true
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        memory: 2Gi

  epp:
    replicas: 1            # precise 的 in-flight/index 状态是进程本地的，D4 不跑 HA
    flags:
      v: 2
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        memory: 8Gi
    pluginsConfigFile: "precise-plugins.yaml"
    pluginsCustomConfig:
      precise-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
          - type: token-producer
            parameters:
              # 必须等于 vLLM 的 --served-model-name；不一致时 render 会被拒绝，
              # 请求仍然 200，但路由会退化成“没有 cache 信息”。
              modelName: qwen3-4b
              vllm:
                endpointDiscovery:
                  attemptTimeout: 2s
                messagesRenderMode: auto
                responsesRenderMode: auto

          - type: endpoint-notification-source

          - type: precise-prefix-cache-producer
            parameters:
              tokenProcessorConfig:
                blockSizeTokens: 64   # 必须等于 vLLM --block-size
                hashAlgorithm: xxh64
              speculativeIndexing: true
              indexerConfig:
                kvBlockIndexConfig:
                  enableMetrics: true
              kvEventsConfig:
                engineType: "vllm"
                topicFilter: "kv@"
                concurrency: 8
                discoverPods: true
                podDiscoveryConfig:
                  socketPort: 5556
                  replaySocketPort: 5559   # 与 vLLM 的 replay_endpoint 对应

          - type: inflight-load-producer
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer

          - type: prefix-cache-affinity-filter
            parameters:
              prefixMatchInfoProducerName: precise-prefix-cache-producer
              # 15926 是 llm-d guide 的 H100 80GB / Qwen3-32B / TP=2 参考值。
              # 2×3060 12GB + Qwen3-4B-AWQ 必须用 calibration Job 重测后替换（§5.8）。
              # 不重测时这个值偏高，相当于把 saturation override 关掉：
              # 路由仍然按 prefix 命中走，但不会在副本过热时主动扩散。
              peakPrefillThroughput: 15926

          - type: token-load-scorer

        dataLayer:
          sources:
            - pluginRef: endpoint-notification-source
              extractors:
                - pluginRef: precise-prefix-cache-producer

        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: prefix-cache-affinity-filter
              - pluginRef: token-load-scorer

  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081   # Envoy sidecar
