# D6a canary for KServe Standard/RawDeployment mode.
# v0.20+ uses spec.canary (a list), NOT canaryTrafficPercent:
# canaryTrafficPercent is silently ignored in Standard mode (it is a Knative field).
# The canary predictor name drives the Deployment name: qwen3-8b-canary-predictor.
# --max-model-len=4096 is intentionally different so the canary is a distinct variant.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen3-8b
  namespace: kserve-test
  annotations:
    serving.kserve.io/deploymentMode: Standard
    serving.kserve.io/autoscalerClass: hpa
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 2
    model:
      modelFormat:
        name: vLLM
      runtime: kserve-vllmserver-d6
      storageUri: hf://Qwen/Qwen3-8B-AWQ
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "24Gi"
          nvidia.com/gpu: "1"
  canary:
    - predictor:
        name: canary
        model:
          modelFormat:
            name: vLLM
          runtime: kserve-vllmserver-d6
          storageUri: hf://Qwen/Qwen3-8B-AWQ
          args:
            - --max-model-len=4096
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "24Gi"
              nvidia.com/gpu: "1"
      trafficPercent: 10
